  :root{
    color-scheme:light;
    --red:#C7000B;
    --red-dark:#8c0008;
    --ink:#121417;
    --muted:#5b6168;
    --line:#e7e9ec;
    --bg:#eef0f3;
    --radius:16px;
  }
  *{box-sizing:border-box;}
  body{
    font-family:"TH Sarabun New",-apple-system,BlinkMacSystemFont,"Leelawadee UI","Noto Sans Thai","Segoe UI",Tahoma,Geneva,sans-serif;
    background:var(--bg); color:var(--ink); margin:0; padding:14px;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:760px;margin:0 auto;}
  .app-header{
    background:#fff;border-radius:var(--radius);padding:22px 22px 20px;margin-bottom:18px;
    position:relative;overflow:hidden;box-shadow:0 1px 2px rgba(16,20,24,.04),0 6px 16px rgba(16,20,24,.06);
    border:1px solid var(--line);
  }
  .app-header::before{
    content:"";position:absolute;top:0;left:0;right:0;height:5px;
    background:linear-gradient(90deg,var(--red),#ff4d4d);
  }
  .app-header-row{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;}
  .app-header-text{flex:1;min-width:0;}
  .app-header h1{font-size:24px;margin:0 0 4px;color:var(--ink);font-weight:800;}
  .app-header .sub{font-size:15px;color:var(--muted);margin:0;font-weight:600;}
  .logo-badge{flex:none;}
  .logo-badge img{display:block;height:40px;width:auto;}

  .section-label{font-size:13.5px;font-weight:800;color:var(--muted);text-transform:uppercase;
    letter-spacing:.04em;margin:22px 4px 10px;}

  .card-list{display:flex;flex-direction:column;gap:12px;}
  .form-card{
    display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line);
    border-radius:var(--radius);padding:16px 18px;text-decoration:none;color:inherit;
    box-shadow:0 1px 2px rgba(16,20,24,.04);transition:box-shadow .12s, transform .08s;
  }
  .form-card:hover{box-shadow:0 6px 16px rgba(16,20,24,.1);transform:translateY(-1px);}
  .form-icon{
    flex:none;width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;
    font-size:22px;background:linear-gradient(135deg,var(--red-dark),var(--red));color:#fff;
  }
  .form-info{flex:1;min-width:0;}
  .form-title{font-size:18px;font-weight:800;color:var(--ink);margin:0 0 2px;}
  .form-desc{font-size:14.5px;color:var(--muted);margin:0;font-weight:600;line-height:1.4;}
  .form-arrow{flex:none;font-size:22px;color:var(--muted);}

  .empty-note{
    text-align:center;color:var(--muted);font-size:14.5px;font-weight:700;padding:18px;
    border:1.5px dashed var(--line);border-radius:var(--radius);
  }

  .footnote{font-size:13.5px;color:var(--muted);text-align:center;margin-top:24px;font-weight:600;line-height:1.6;}
</style>

<script>
// Add a new entry here whenever a new form/page is ready — it will appear
// automatically on this portal page. No other changes needed.
const FORMS = [
  {
    title: "Morning Store Checklist",
    desc: "แบบฟอร์มตรวจสอบความพร้อมตอนเปิดร้าน (รายวัน)",
    url: "/checklist",
    icon: "📋"
  },
  {
    title: "Report Dashboard",
    desc: "ดูสรุปผลคะแนนทุกสาขา (สำหรับผู้ที่ได้รับสิทธิ์เท่านั้น)",
    url: "/report-dashboard",
    icon: "📊"
  }
];

const listEl = document.getElementById('formList');
if(FORMS.length === 0){
  listEl.innerHTML = '<div class="empty-note">ยังไม่มีฟอร์มเปิดใช้งานตอนนี้</div>';
} else {
  FORMS.forEach(f => {
    const a = document.createElement('a');
    a.className = 'form-card';
    a.href = f.url;
    a.innerHTML = `
      <div class="form-icon">${f.icon}</div>
      <div class="form-info">
        <div class="form-title">${f.title}</div>
        <div class="form-desc">${f.desc}</div>
      </div>
      <div class="form-arrow">›</div>
    `;
    listEl.appendChild(a);
  });
}
</script>
