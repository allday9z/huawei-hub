<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HUAWEI Hub · ตั้งค่า</title>
<script>window.gisReady=function(){window.__gisLoaded=true;};</script>
<script src="https://accounts.google.com/gsi/client" async onload="gisReady()"></script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f4f6;--card:#fff;--ink:#1d1d1f;--muted:#6e6e73;--line:#e4e4e9;
  --red:#c7000b;--red-soft:#fdecec;--ok:#14864a;--ok-soft:#e4f5eb;
  --chip:#f1f1f4;--warn:#b26a00;--warn-soft:#fff3df;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{font-family:'IBM Plex Sans Thai',system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;font-size:15px}
button,select,input{font:inherit;color:inherit}
.wrap{max-width:820px;margin:0 auto;padding:16px 16px 60px}

.top{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px;margin-bottom:12px;position:relative;overflow:hidden}
.top::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--ink)}
.toprow{display:flex;justify-content:space-between;align-items:center;gap:12px}
.logo{display:block;width:118px;height:auto}
.me{font-size:12.5px;color:var(--muted);text-align:right;line-height:1.4}
.me b{color:var(--ink);font-weight:600}
.titlerow{margin-top:14px;padding-top:14px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap}
h1{font-size:23px;font-weight:700;letter-spacing:-.015em}
h1 em{font-style:normal;color:var(--red)}
.tag{font-size:12.5px;color:var(--muted);margin-top:2px}
.link{border:0;background:none;color:var(--muted);font-size:13px;cursor:pointer;padding:4px 0}
.link.red{color:var(--red);font-weight:600}

.tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;padding-bottom:2px}
.tab{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 16px;cursor:pointer;font-weight:500;white-space:nowrap}
.tab.on{background:var(--ink);border-color:var(--ink);color:#fff}
.tab span{opacity:.6;font-size:12px;margin-left:4px}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.bar .grow{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid transparent;background:var(--chip);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13.5px}
.chip.on{background:var(--ink);color:#fff}
.btn{border:0;border-radius:10px;padding:9px 14px;font-weight:600;cursor:pointer;background:var(--ink);color:#fff;font-size:14px}
.btn.sec{background:var(--chip);color:var(--ink)}
.btn.warn{background:var(--red-soft);color:var(--red)}
.btn:disabled{opacity:.5;cursor:not-allowed}
input.f,select.f{width:100%;background:var(--chip);border:1px solid transparent;border-radius:10px;padding:9px 11px}
input.f:focus,select.f:focus{outline:2px solid var(--ink);outline-offset:1px;background:#fff}
label.l{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.hint{font-size:12.5px;color:var(--muted)}

.rows{list-style:none}
.rows>li{border-top:1px solid var(--line);padding:11px 0;display:flex;gap:10px;align-items:center}
.rows>li:first-child{border-top:0}
.rows .main{flex:1;min-width:0}
.rows .name{font-weight:600}
.rows .sub{font-size:12.5px;color:var(--muted)}
.rows li.off .name{color:var(--muted);text-decoration:line-through}
.tagb{display:inline-block;font-size:11.5px;font-weight:600;border-radius:6px;padding:1px 7px;margin:2px 4px 0 0;background:var(--chip);color:var(--muted)}
.tagb.all{background:var(--ink);color:#fff}
.tagb.ok{background:var(--ok-soft);color:var(--ok)}
.tagb.warn{background:var(--warn-soft);color:var(--warn)}
.tagb.red{background:var(--red-soft);color:var(--red)}

.editor{background:var(--chip);border-radius:12px;padding:12px;margin:6px 0 10px;display:grid;gap:10px}
.editor .chip{background:#fff}
.editor .chip.on{background:var(--ink)}
.acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}

.br{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.brhead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.brcode{font-size:17px;font-weight:700}
.brname{font-size:13px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 110px;gap:10px}
.pin{font-family:ui-monospace,Menlo,monospace;font-size:18px;font-weight:700;letter-spacing:.18em}
.kv{font-size:12px;color:var(--muted)}
.kv b{display:block;color:var(--ink);font-size:14px;font-weight:500;word-break:break-all}

.appico{width:40px;height:40px;flex:none;border-radius:11px;background:var(--red-soft);color:var(--red);display:grid;place-items:center}
.appico .i{width:21px;height:21px}
.iconpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:6px}
.ip{border:1.5px solid transparent;background:#fff;border-radius:10px;padding:8px 4px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink)}
.ip .i{width:22px;height:22px}
.ip span{font-size:11.5px;color:var(--muted)}
.ip.on{border-color:var(--red);color:var(--red)}
.ip.on span{color:var(--red)}
.log li{display:block}
.log .when{font-size:12px;color:var(--muted)}

.gate{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px}
.gatebox{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px 20px;width:100%;max-width:380px;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden}
.gatebox::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:var(--ink)}
.gbtn{min-height:44px;display:flex;justify-content:center}
.msg{font-size:13px;color:var(--muted)}
.msg.err{color:var(--red);font-weight:600}
.demo{font-size:12px;color:var(--warn);background:var(--warn-soft);border-radius:8px;padding:6px 10px}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:9px 16px;border-radius:10px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:50;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{background:var(--red)}

@media (max-width:560px){
  .grid2{grid-template-columns:1fr}
  .bar{flex-direction:column;align-items:stretch}
  .bar .btn{order:-1}
  .grid3{grid-template-columns:1fr 1fr}
  .grid3 label:last-child{grid-column:1/-1}
}
.note{font-size:13px;color:var(--muted);background:var(--chip);border-radius:10px;padding:9px 12px;margin-bottom:12px}
/* การใช้งาน (activity) */
.actf{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.act>li{align-items:flex-start}
.act .t{flex:none;width:46px;font-weight:700;font-variant-numeric:tabular-nums}
.act .sub{word-break:break-word}
.dayh{font-size:13px;font-weight:700;color:var(--muted);margin:14px 0 2px}
.dayh:first-child{margin-top:0}
.who{cursor:pointer}
.who:hover .name{text-decoration:underline}
@media (max-width:560px){ .actf{grid-template-columns:1fr 1fr} }
.cks>li{align-items:center;gap:10px}
.cks .st{flex:none;min-width:74px;text-align:center;font-size:12.5px;font-weight:700;border-radius:8px;padding:4px 6px}
.cks .st.ok{background:var(--ok-soft,#e7f6ec);color:var(--ok,#1e8e3e)} .cks .st.no{background:var(--red-soft,#fdecec);color:var(--red)} .cks .st.na{background:var(--chip);color:var(--muted)}
</style>
</head>

/* ===== token ===== */
function jwtPayload(t){
  try{ let b=String(t).split('.')[1].replace(/-/g,'+').replace(/_/g,'/'); while(b.length%4) b+='=';
    return JSON.parse(decodeURIComponent(atob(b).split('').map(c=>'%'+('00'+c.charCodeAt(0).toString(16)).slice(-2)).join(''))); }catch(e){ return null; }
}
function savedToken(){
  let t=null; try{ t=localStorage.getItem(TOKEN_KEY); }catch(e){}
  if(t && t.startsWith('dev:')) return t;               // local testing only (server must allow it)
  const p = t && jwtPayload(t);
  return p && Number(p.exp||0)*1000 - 60000 > Date.now() ? t : null;
}

/* ===== API ===== */
async function api(path, body){
  const res = await fetch(path, body ? {method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer '+token}, body:JSON.stringify(body)}
                                     : {headers:{'Authorization':'Bearer '+token}});
  return res.json();
}
async function load(){
  try{
    const r = await api('/api/admin/load');

    handleErr(r);
  }catch(e){ toast('เชื่อมต่อไม่ได้ ลองใหม่อีกครั้ง',true); }
}
function handleErr(r){
  if(r.error==='auth'){ token=null; try{ localStorage.removeItem(TOKEN_KEY); }catch(e){} showGate('การเข้าสู่ระบบหมดอายุ กรุณาเข้าสู่ระบบใหม่'); retrySilent(); return true; }

  return false;
}
async function op(a, okMsg){

}

window.gisReady = function(){

}

/* ===== การใช้งาน: แต่ละอีเมลทำรายการอะไร สาขาไหน กี่โมง (Antt, 26 ต.ค. 2569) ===== */
const bkDay = (ms) => new Date(ms + 7*3600e3).toISOString().slice(0,10);
const bkHM = iso => new Date(new Date(iso).getTime() + 7*3600e3).toISOString().slice(11,16);
const thDay = d => new Date(d+'T12:00:00+07:00').toLocaleDateString('th-TH',{timeZone:'Asia/Bangkok',weekday:'long',day:'numeric',month:'short',year:'numeric'});
const ACT_APPS = [['all','ทั้งหมด'],['checklist','Morning Checklist'],['case','Service Case'],['st','ST Report'],['foot','Foot Traffic'],['seen','เข้าใช้งาน']];
let actQ = {from:bkDay(Date.now()), to:bkDay(Date.now())}, actD = null, actBusy = false, actApp = 'all', actBr = '', actEm = '', actShow = 300;
async function loadAct(){
  actBusy = true; if(tab==='act') render();
  try{
    const r = await api('/api/admin/activity?from='+actQ.from+'&to='+actQ.to);
    if(r.ok) actD = r; else if(!handleErr(r)) toast(r.error||'โหลดประวัติไม่สำเร็จ', true);
  }catch(e){ toast('โหลดประวัติไม่สำเร็จ ลองใหม่อีกครั้ง', true); }
  actBusy = false; actShow = 300; if(tab==='act') render();
}
function actNote(email){
  const l = D.logins.find(x=>x.email.toLowerCase()===String(email).toLowerCase());
  const p = actD && actD.people.find(x=>x.email===email);
  return (l && l.note) || (p && p.note) || '';
}
// Morning Checklist: สาขาไหนส่งแล้ว / ยังไม่ส่ง กี่โมง ใครตรวจ — ย้ายมาจาก รายงานสาขา › Checklist (Antt, 27 ต.ค. 2569)
function viewCkSent(one){
  const today = actD.today || bkDay(Date.now()), due = actD.due || '';
  const days = []; for(let d = new Date(actQ.from+'T12:00:00Z'); d <= new Date(actQ.to+'T12:00:00Z') && days.length < 70; d.setUTCDate(d.getUTCDate()+1)){ const k = d.toISOString().slice(0,10); if(k <= today) days.push(k); }
  const ck = actD.rows.filter(r=>r.app==='checklist');   // ล่าสุดก่อน
  const brs = D.branches.map(b=>b.code).filter(b=>!actBr || b===actBr);
  const latest = {};   // branch|day -> latest send of that day
  for(const r of ck){ const k = r.branch+'|'+r.day; if(!latest[k]) latest[k] = r; }
  const score = r => r.total ? (r.pass||0)+'/'+r.total : (r.detail||'').replace(/ · .*$/,'').replace(/^ผ่าน /,'');
  let sent = 0;
  const items = brs.map(b=>{
    const name = (D.branches.find(x=>x.code===b)||{}).name || '';
    if(one){
      const r = latest[b+'|'+actQ.from], future = actQ.from > today;
      if(r) sent++;
      return '<li><span class="st '+(r?'ok':future?'na':'no')+'">'+(r?'ส่งแล้ว':future?'–':'ยังไม่ส่ง')+'</span><div class="main"><div class="name">'+b+' <span class="hint">'+esc(name)+'</span></div>'+
        (r ? '<div class="sub">ส่ง '+bkHM(r.at)+' น.'+(r.late?' <span class="tagb red">หลัง '+esc(r.late)+'</span>':'')+' · ผ่าน '+esc(score(r))+(r.inspector?' · ผู้ตรวจ '+esc(r.inspector):'')+' · '+esc(r.email)+'</div>' : (due && !future ? '<div class="sub">กำหนดส่ง '+esc(due)+' น.</div>' : ''))+'</div></li>';
    }
    const got = days.filter(d=>latest[b+'|'+d]), late = got.filter(d=>latest[b+'|'+d].late).length;
    const last = got.length ? latest[b+'|'+got.sort().slice(-1)[0]] : null;
    if(got.length === days.length && days.length) sent++;
    return '<li><span class="st '+(!days.length?'na':got.length===days.length?'ok':'no')+'">'+got.length+'/'+days.length+' วัน</span><div class="main"><div class="name">'+b+' <span class="hint">'+esc(name)+'</span>'+(late?' <span class="tagb red">ส่งหลัง '+esc(due)+' '+late+' วัน</span>':'')+'</div>'+
      (last ? '<div class="sub">ล่าสุด '+last.day.slice(8)+'/'+last.day.slice(5,7)+' '+bkHM(last.at)+' น. · ผ่าน '+esc(score(last))+(last.inspector?' · ผู้ตรวจ '+esc(last.inspector):'')+'</div>' : '<div class="sub">ยังไม่ได้ส่งในช่วงนี้</div>')+'</div></li>';
  });
  const head = one ? 'ส่งแล้ว '+sent+'/'+brs.length+' สาขา' : 'ส่งครบทุกวัน '+sent+'/'+brs.length+' สาขา · '+days.length+' วัน';
  return '<section class="card"><div class="bar" style="margin-bottom:4px"><b class="grow">Morning Checklist — สาขาที่ส่ง'+(one?' · '+esc(thDay(actQ.from)):'')+'</b><span class="hint">'+head+(due?' · กำหนด '+esc(due)+' น.':'')+'</span></div>'+
    '<ul class="rows cks">'+items.join('')+'</ul></section>';
}
function viewAct(){
  if(!actD && !actBusy) setTimeout(loadAct);
  const emails = [...new Set([...(actD?actD.people.map(p=>p.email):[]), ...D.logins.filter(l=>l.active).map(l=>l.email)])].sort();
  let h = '<p class="note">ดูว่าแต่ละอีเมลทำรายการอะไร สาขาไหน กี่โมง ดึงจากข้อมูลที่บันทึกในระบบ: Morning Store Checklist (ที่ส่งตั้งแต่ 22 ต.ค. 69), Service Case, ST Report และเวลาที่เปิดหน้าแรกของ Hub (เริ่มเก็บ 26 ต.ค. 69) · เวลาเป็นเวลาที่ทำรายการบนเครื่อง</p>'+
    '<section class="card"><div class="actf">'+
      '<label class="l">ตั้งแต่วันที่<input class="f" type="date" id="acFrom" value="'+actQ.from+'"></label>'+
      '<label class="l">ถึงวันที่<input class="f" type="date" id="acTo" value="'+actQ.to+'"></label>'+
      '<label class="l">สาขา<select class="f" id="acBr"><option value="">ทุกสาขา</option>'+D.branches.map(b=>'<option value="'+b.code+'"'+(actBr===b.code?' selected':'')+'>'+b.code+' · '+esc(b.name)+'</option>').join('')+'</select></label>'+
      '<label class="l">อีเมล<select class="f" id="acEm"><option value="">ทุกอีเมล</option>'+emails.map(e=>{ const n=actNote(e); return '<option value="'+esc(e)+'"'+(actEm===e?' selected':'')+'>'+esc(e)+(n?' · '+esc(n):'')+'</option>'; }).join('')+'</select></label>'+
    '</div><div class="chips" style="margin-top:10px">'+
      [['0','วันนี้'],['1','เมื่อวาน'],['7','7 วันล่าสุด'],['30','30 วันล่าสุด']].map(([k,l])=>'<button class="chip" data-acr="'+k+'">'+l+'</button>').join('')+
    '</div><div class="chips" style="margin-top:8px">'+
      ACT_APPS.map(([k,l])=>'<button class="chip'+(actApp===k?' on':'')+'" data-aca="'+k+'">'+l+'</button>').join('')+
    '</div></section>';
  if(!actD) return h + '<section class="card"><p class="hint">'+(actBusy?'กำลังโหลด…':'โหลดไม่สำเร็จ กด ↻ โหลดใหม่')+'</p></section>';
  const rows = actD.rows.filter(r=>(actApp==='all'||r.app===actApp) && (!actBr||r.branch===actBr) && (!actEm||r.email===actEm));
  const one = actQ.from===actQ.to;
  if(actApp==='all' || actApp==='checklist') h += viewCkSent(one);
  // สรุปตามอีเมล
  const by = {};
  for(const r of rows){
    const p = by[r.email] || (by[r.email] = {email:r.email, branches:new Set(), n:{checklist:0,case:0,st:0,foot:0}, ck:[], seen:null, last:''});
    if(r.branch) p.branches.add(r.branch);
    if(r.app==='seen') p.seen = r; else p.n[r.app]++;
    if(r.app==='checklist'){ p.ck.push(bkHM(r.at)+' น.'+(r.late?' (หลัง '+r.late+')':'')); if(r.late) p.late=true; }
    if(r.at > p.last) p.last = r.at;
  }
  const ppl = Object.values(by).sort((a,b)=>b.last.localeCompare(a.last));
  h += '<section class="card"><div class="bar" style="margin-bottom:4px"><b class="grow">สรุปตามอีเมล</b><span class="hint">'+ppl.length+' อีเมล · '+rows.length+' รายการ'+(actBusy?' · กำลังโหลด…':'')+'</span></div>';
  h += ppl.length ? '<ul class="rows">'+ppl.map(p=>{
    const n = actNote(p.email);
    const tags = [];
    if(p.n.checklist) tags.push('<span class="tagb '+(p.late?'red':'ok')+'">Checklist '+(one?'ส่ง '+p.ck.reverse().join(', '):p.n.checklist+' ครั้ง')+'</span>');
    if(p.n.case) tags.push('<span class="tagb">Service Case '+p.n.case+'</span>');
    if(p.n.st) tags.push('<span class="tagb">ST Report '+p.n.st+'</span>');
    if(p.n.foot) tags.push('<span class="tagb">Foot Traffic '+(one?'':p.n.foot+' วัน')+'</span>');
    if(p.seen && one) tags.push('<span class="tagb">เข้าใช้งาน '+esc(p.seen.detail.replace(/^ครั้งแรก /,'').replace(/ · ล่าสุด /,'–').replace(/ · .*$/,''))+' น.</span>');
    else if(p.seen) tags.push('<span class="tagb">เข้าใช้งาน</span>');
    return '<li class="who" data-acem="'+esc(p.email)+'"><div class="main"><div class="name">'+esc(p.email)+'</div><div class="sub">'+(n?esc(n)+' · ':'')+([...p.branches].join(', ')||'ไม่ระบุสาขา')+'</div><div>'+tags.join('')+'</div></div></li>';
  }).join('')+'</ul>' : '<p class="hint">ไม่มีรายการในช่วงนี้</p>';
  h += '</section>';
  // รายการตามเวลา (ล่าสุดก่อน)
  h += '<section class="card"><b>รายการตามเวลา</b>';
  if(!rows.length) h += '<p class="hint" style="margin-top:6px">ไม่มีรายการ</p>';
  let day = '', list = '';
  for(const r of rows.slice(0, actShow)){
    const d = bkDay(new Date(r.at).getTime());
    if(d!==day){ if(list) h += '<ul class="rows act">'+list+'</ul>'; list=''; day=d; h += '<div class="dayh">'+esc(thDay(d))+'</div>'; }
    const n = actNote(r.email);
    list += '<li><div class="t">'+bkHM(r.at)+'</div><div class="main"><div class="name">'+esc(r.action)+(r.branch?' <span class="tagb">'+esc(r.branch)+'</span>':'')+(r.late?' <span class="tagb red">หลัง '+esc(r.late)+'</span>':'')+'</div>'+
      '<div class="sub">'+esc(r.email)+(n?' · '+esc(n):'')+'</div>'+(r.detail?'<div class="sub">'+esc(r.detail)+'</div>':'')+'</div></li>';
  }
  if(list) h += '<ul class="rows act">'+list+'</ul>';
  if(rows.length > actShow) h += '<div class="acts" style="justify-content:center;margin-top:8px"><button class="btn sec" data-act="actMore">แสดงเพิ่ม (อีก '+(rows.length-actShow)+' รายการ)</button></div>';
  return h + '</section>';
}
document.addEventListener('change', e=>{
  const id = e.target.id;
  if(id==='acFrom' || id==='acTo'){
    const f=$('acFrom').value, t=$('acTo').value;
    if(!f || !t) return;
    actQ = {from: f<=t?f:t, to: f<=t?t:f}; loadAct();
  }
  if(id==='acBr'){ actBr = e.target.value; actShow = 300; render(); }
  if(id==='acEm'){ actEm = e.target.value; actShow = 300; render(); }
});

function viewLog(){
  return '<section class="card"><ul class="rows log">'+(D.log.length?D.log.map(l=>'<li><div class="when">'+esc(l.at)+' · '+esc(l.by)+'</div><div><b>'+esc(l.op)+'</b>'+(l.detail?' — '+esc(l.detail):'')+'</div></li>').join(''):'<li class="hint">ยังไม่มีประวัติการแก้ไข</li>')+'</ul></section>';
}

// Who may use which menu: each listed email has "ทุกเมนู" or its own set of menus.
// สาขาที่มีผลจริง (lock มาจากเซิร์ฟเวอร์: ตั้งเอง หรือได้จากหมายเหตุ/ชื่ออีเมล)
function branchLabel(l){
  if(l.lock) return '<span class="tagb" style="background:#FDECEC;color:#C7000B">ล็อกสาขา '+esc(l.lock)+(l.branch?'':' (อัตโนมัติ)')+'</span>';
  return '<span class="tagb">เลือกสาขาเองได้</span>';
}
function menuLabel(l){
  if(l.menus==='*') return '<span class="tagb all">ทุกเมนู</span>';
  return (l.menus||[]).map(id=>{ const a=D.apps.find(x=>x.row===id); return a?'<span class="tagb ok">'+esc(a.name)+'</span>':''; }).join('');
}
function loginEditor(l){
  const all = l.menus==='*', sel = all ? [] : (l.menus||[]);
  return '<div class="editor">'+
    '<div class="grid2" style="margin-top:0"><label class="l">อีเมล<input class="f" id="elEmail" type="email" placeholder="name@gmail.com" value="'+esc(l.email)+'"'+(l.row?' disabled':'')+'></label>'+
    '<label class="l">ชื่อ / หมายเหตุ<input class="f" id="elNote" placeholder="เช่น HMD-CWN หรือ สมชาย (ชาย) · HOHW" value="'+esc(l.note||'')+'"></label></div>'+
    // สาขาของอีเมลนี้: อัตโนมัติ (รหัสสาขาในหมายเหตุ / ชื่ออีเมล) · ล็อกสาขาที่เลือก · ไม่ล็อก (ทีม HOHW เลือกสาขาเอง)
    '<label class="l" style="margin-bottom:12px">สาขาของอีเมลนี้ (ล็อกตอนเข้าสู่ระบบ)<select class="f" id="elBranch">'+
      '<option value=""'+(!l.branch?' selected':'')+'>อัตโนมัติ — ตามรหัสสาขาในหมายเหตุ หรือชื่ออีเมล (เช่น hmdhktbyuficon → HMD-HKT)</option>'+
      (D.branches||[]).map(b=>'<option value="'+b.code+'"'+(l.branch===b.code?' selected':'')+'>ล็อก '+b.code+' · '+esc(b.name)+'</option>').join('')+
      '<option value="*"'+(l.branch==='*'?' selected':'')+'>ไม่ล็อก — เลือกสาขาเองตอนเข้าใช้ (ทีม HOHW)</option>'+
    '</select></label>'+
    '<div><p class="hint" style="margin-bottom:6px">ใช้เมนูไหนได้บ้าง (เลือกได้หลายเมนู)</p><div class="chips">'+
      '<button type="button" class="chip'+(all?' on':'')+'" data-lgm="*">ทุกเมนู</button>'+
      D.apps.map(a=>'<button type="button" class="chip'+(!all&&sel.includes(a.row)?' on':'')+'" data-lgm="'+a.row+'">'+esc(a.name)+(a.active?'':' (ซ่อนอยู่)')+'</button>').join('')+
    '</div></div>'+
    '<div class="acts"><button class="btn sec" data-act="lgCancel">ยกเลิก</button><button class="btn" data-act="lgSave">'+(l.row?'บันทึก':'เพิ่ม')+'</button></div></div>';
}
function viewLogins(){
  const owners = D.owners || [D.owner];
  return '<section class="card">'+
    '<p class="note">กำหนดว่าแต่ละอีเมล<b>ใช้เมนูไหนได้บ้าง</b> — ล็อกอินที่หน้าแรกแล้วจะเห็นเฉพาะเมนูที่เลือก · เลือก "Checklist Report Dashboard" = เปิดดูคะแนนทุกสาขาได้<br>'+
    'อีเมลที่ไม่อยู่ในรายการ (หรือไม่ได้ล็อกอิน) เห็นเมนูที่ตั้งเป็น "ทุกคน" ในแท็บแอป · หน้าตั้งค่า ⚙️ เข้าได้เฉพาะเจ้าของระบบ</p>'+
    '<div class="bar"><span class="grow"></span><button class="btn" data-act="lgNew">+ เพิ่มอีเมล</button></div>'+
    (editLogin && !editLogin.row ? loginEditor(editLogin) : '')+
    '<ul class="rows">'+D.logins.map(l=>{
      const own = owners.includes(l.email);
      return '<li class="'+(l.active?'':'off')+'"><div class="main"><div class="name">'+esc(l.email)+'</div><div class="sub">'+esc(l.note||'')+'</div><div>'+
        (own?'<span class="tagb all">เจ้าของระบบ · ทุกเมนู</span><span class="tagb">เข้าหน้าตั้งค่าได้</span>':menuLabel(l)+branchLabel(l))+(l.active?'':'<span class="tagb red">ปิดสิทธิ์</span>')+
      '</div></div>'+(own?'':'<button class="btn sec" data-act="lgEdit" data-email="'+esc(l.email)+'">แก้ไข</button><button class="btn '+(l.active?'warn':'sec')+'" data-act="lgToggle" data-email="'+esc(l.email)+'">'+(l.active?'ปิดสิทธิ์':'เปิดสิทธิ์')+'</button>')+'</li>'+
      (editLogin && editLogin.row===l.row ? '<li style="display:block;border-top:0;padding-top:0">'+loginEditor(editLogin)+'</li>' : '');
    }).join('')+'</ul></section>';
}

/* ===== Actions ===== */
document.addEventListener('click', async e=>{
  const t = e.target.closest('[data-tab]'); if(t){ tab=t.dataset.tab; store.set('hub_admin_tab',tab); editStaff=editApp=editLogin=null; return render(); }
  const sf = e.target.closest('[data-sf]'); if(sf){ staffFilter=sf.dataset.sf; return render(); }
  const ar = e.target.closest('[data-acr]'); if(ar){ const k=+ar.dataset.acr, now=Date.now(); actQ = k===1 ? {from:bkDay(now-864e5), to:bkDay(now-864e5)} : {from:bkDay(now-Math.max(0,k-1)*864e5), to:bkDay(now)}; return loadAct(); }
  const aa = e.target.closest('[data-aca]'); if(aa){ actApp=aa.dataset.aca; actShow=300; return render(); }
  const ae = e.target.closest('[data-acem]'); if(ae){ actEm = actEm===ae.dataset.acem ? '' : ae.dataset.acem; actShow=300; render(); return window.scrollTo({top:0,behavior:'smooth'}); }
  const eb = e.target.closest('[data-esbr]');
  if(eb){
    readStaffEditor();
    let sel = brList(editStaff.branches); const v = eb.dataset.esbr;
    if(v==='*') sel = sel.includes('*')?[]:['*'];
    else { sel = sel.filter(x=>x!=='*'); sel = sel.includes(v)?sel.filter(x=>x!==v):sel.concat(v); }
    editStaff.branches = sel.join(', '); return render();
  }
  const lm = e.target.closest('[data-lgm]');
  if(lm){
    readLoginEditor();
    const v = lm.dataset.lgm;
    if(v==='*') editLogin.menus = editLogin.menus==='*' ? [] : '*';
    else { let sel = editLogin.menus==='*' ? [] : (editLogin.menus||[]).slice(); const id=+v; sel = sel.includes(id) ? sel.filter(x=>x!==id) : sel.concat(id); editLogin.menus = sel; }
    return render();
  }
  const au = e.target.closest('[data-aud]'); if(au){ readAppEditor(); editApp.audience=au.dataset.aud; return render(); }
  const ic = e.target.closest('[data-icon]'); if(ic){ readAppEditor(); editApp.icon=ic.dataset.icon; return render(); }
  const mo = e.target.closest('[data-mom]'); if(mo){ readAppEditor(); editApp.moment=mo.dataset.mom; return render(); }
  const a = e.target.closest('[data-act]'); if(!a) return;
  const act = a.dataset.act;
  if(act==='actMore'){ actShow += 300; return render(); }
  if(act==='appNew'){ editApp={row:0,icon:'file',name:'',desc:'',url:'/',audience:'ทุกคน',moment:'ระหว่างวัน',active:true}; render(); $('eaName').focus(); }
  if(act==='appEdit'){ editApp={...D.apps.find(x=>x.row===+a.dataset.row)}; render(); }
  if(act==='appCancel'){ editApp=null; render(); }
  if(act==='appUp'||act==='appDown'){ a.disabled=true; await op({op:'app.move',row:+a.dataset.row,dir:act==='appUp'?'up':'down'},'เรียงลำดับแล้ว'); }
  if(act==='appSave'||act==='appToggle'){
    readAppEditor();
    const body={op:'app.save',row:editApp.row||0,icon:editApp.icon,name:editApp.name,desc:editApp.desc,url:editApp.url,audience:editApp.audience,moment:editApp.moment||'ระหว่างวัน',due:editApp.due||'',active:act==='appToggle'?!editApp.active:editApp.active};
    a.disabled=true;
    if(await op(body, act==='appToggle'?(body.active?'แสดงบนหน้าแรกแล้ว':'ซ่อนจากหน้าแรกแล้ว'):'บันทึกแอปแล้ว')){ editApp=null; render(); } else a.disabled=false;
  }
  if(act==='lgNew'){ editLogin={row:0,email:'',note:'',branch:'',menus:D.apps.filter(x=>x.audience!=='ผู้ดูแล').map(x=>x.row),active:true}; render(); $('elEmail').focus(); }
  if(act==='lgEdit'){ editLogin={...D.logins.find(y=>y.email===a.dataset.email)}; render(); }
  if(act==='lgCancel'){ editLogin=null; render(); }
  if(act==='lgSave'){
    readLoginEditor();
    const em=String(editLogin.email||'').trim().toLowerCase();
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)) return toast('อีเมลไม่ถูกต้อง',true);
    if(editLogin.menus!=='*' && !(editLogin.menus||[]).length) return toast('เลือกอย่างน้อย 1 เมนู',true);
    if(!editLogin.row && D.logins.some(y=>y.email===em)) return toast('มีอีเมลนี้ในรายการแล้ว — กดแก้ไขที่แถวนั้น',true);
    a.disabled=true;
    if(await op({op:'login.save',email:em,note:editLogin.note||'',menus:editLogin.menus,branch:editLogin.branch||'',active:editLogin.active!==false}, editLogin.row?'บันทึกแล้ว':'เพิ่มอีเมลแล้ว')){ editLogin=null; render(); } else a.disabled=false;
  }
  if(act==='lgToggle'){
    const x=D.logins.find(y=>y.email===a.dataset.email);
    if(x.active && !confirm('ปิดสิทธิ์ '+x.email+'?\nจะไม่เห็นเมนู Dashboard และเปิด Dashboard ไม่ได้')) return;
    a.disabled=true; await op({op:'login.save',email:x.email,note:x.note,active:!x.active}, x.active?'ปิดสิทธิ์แล้ว':'เปิดสิทธิ์แล้ว');
  }
  if(act==='staffNew'){ editStaff={row:0,name:'',branches:staffFilter!=='ALL'&&staffFilter!=='NONE'?staffFilter:'',active:true}; render(); $('esName').focus(); }
  if(act==='staffEdit'){ const s=D.staff.find(x=>x.row===+a.dataset.row); editStaff={...s}; render(); }
  if(act==='staffCancel'){ editStaff=null; render(); }
  if(act==='staffSave' || act==='staffToggle'){
    readStaffEditor();
    if(act==='staffToggle' && editStaff.active && !confirm('ปิดการใช้งาน '+editStaff.name+'?\nชื่อนี้จะไม่แสดงใน Checklist / Service Case')) return;
    const body={op:'staff.save',row:editStaff.row||0,name:editStaff.name,branches:brList(editStaff.branches),active:act==='staffToggle'?!editStaff.active:editStaff.active};
    a.disabled=true;
    if(await op(body, act==='staffToggle'?(body.active?'เปิดใช้งานแล้ว':'ปิดการใช้งานแล้ว'):'บันทึกพนักงานแล้ว')) { editStaff=null; render(); }
    else a.disabled=false;
  }
});
function readAppEditor(){ if(!editApp||!$('eaName')) return; editApp.due=$('eaDue').value; editApp.name=$('eaName').value.trim(); editApp.desc=$('eaDesc').value.trim(); editApp.url=$('eaUrl').value.trim(); }
function readLoginEditor(){ if(!editLogin) return; const e=$('elEmail'), n=$('elNote'), b=$('elBranch'); if(e && !editLogin.row) editLogin.email=e.value; if(n) editLogin.note=n.value; if(b) editLogin.branch=b.value; }
function readStaffEditor(){ const n=$('esName'); if(n && editStaff) editStaff.name=n.value; }

/* ===== Init ===== */
token = savedToken();
if(token) load(); else showGate();
if(window.__gisLoaded || (window.google && google.accounts && google.accounts.id)) gisReady();
</script>
</body>
</html>
